name: tamam_customer
description: TAMAM — customer app for rides, delivery and home services in Palestine.
publish_to: "none"
# The number after '+' is the Android versionCode, and Android refuses to install
# a lower one over a higher one -- it reads as a downgrade and fails with the
# unhelpful "App not installed".
#
# `flutter build apk --split-per-abi` does NOT use this number directly: it
# overrides it with `abiVersionCode * 1000 + buildNumber`, where arm64 is 2. A
# split arm64 build of 1.0.0+1 therefore shipped as versionCode 2001, and a later
# non-split build of the same pubspec shipped as 1 -- a downgrade that could not
# be installed over it.
#
# Starting the build number above every code shipped so far keeps both build
# shapes monotonic: plain builds are 3001+, split arm64 builds are 5001+.
version: 1.1.0+3001

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # network & realtime
  dio: ^5.7.0
  socket_io_client: ^3.0.0
  connectivity_plus: ^6.0.5

  # storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # maps & location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # platform
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2

  # presentation
  cached_network_image: ^3.4.1
  visibility_detector: ^0.4.0+2
  flutter_svg: ^2.0.10

  # utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # Bundled rather than fetched. google_fonts downloads a face from
  # fonts.gstatic.com on first use, so until that request finishes -- and forever
  # if it fails -- an Arabic-first app renders its first screen in whatever the OS
  # substitutes. Shipping the files makes the brand face the first frame, removes
  # a cold-start network dependency, and lets a missing file fail the build
  # instead of failing silently on a customer's phone.
  #
  # Tajawal has no 600 weight; Flutter resolves labelLg/labelMd/headingSm to the
  # nearest shipped face, which is 500 or 700.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-400.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-500.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-700.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-800.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-400.ttf
          weight: 400
        - asset: assets/fonts/Poppins-500.ttf
          weight: 500
        - asset: assets/fonts/Poppins-700.ttf
          weight: 700
        - asset: assets/fonts/Poppins-800.ttf
          weight: 800

  # `generate: true` runs `flutter gen-l10n` from l10n.yaml on every build.
  generate: true
