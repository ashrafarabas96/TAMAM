name: tamam_partner
description: TAMAM — partner app for drivers, couriers and technicians in Palestine.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # network & realtime
  dio: ^5.7.0
  socket_io_client: ^3.0.0
  connectivity_plus: ^6.0.5

  # storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # maps & location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # continuous work session (Android foreground service, iOS background location)
  flutter_background_service: ^5.1.0
  battery_plus: ^6.0.3

  # platform
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2

  # presentation
  cached_network_image: ^3.4.1
  visibility_detector: ^0.4.0+2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10

  # utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # `generate: true` runs `flutter gen-l10n` from l10n.yaml on every build.
  generate: true
