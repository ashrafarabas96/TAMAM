# =====================================================================
# TAMAM — the whole platform, locally, in one command:
#
#   docker compose -f infrastructure/docker/docker-compose.yml up -d --build
#
# That builds and starts everything, applies the migrations and seeds the
# reference data, so the admin console at http://localhost:3001 is ready to
# sign in to. Nothing has to be run first.
#
# To start only the datastores (what scripts/setup.sh needs when running the
# API from source instead):
#
#   docker compose -f infrastructure/docker/docker-compose.yml up -d db redis minio
# =====================================================================
name: tamam

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tamam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tamam
      POSTGRES_PASSWORD: tamam
      POSTGRES_DB: tamam
      # Deterministic collation so ORDER BY matches production.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tamam -d tamam']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: tamam-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: tamam-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: tamam
      MINIO_ROOT_PASSWORD: tamam-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the two buckets the API expects and makes the public one readable.
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: tamam-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 tamam tamam-secret &&
      mc mb --ignore-existing local/tamam-private &&
      mc mb --ignore-existing local/tamam-public &&
      mc anonymous set download local/tamam-public &&
      mc anonymous set none local/tamam-private &&
      echo 'buckets ready: tamam-private (private), tamam-public (download)'
      "
    restart: 'no'

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: tamam-api
    restart: unless-stopped
    env_file:
      # Optional so `docker compose up -d db redis minio` works before scripts/setup.sh
      # has written the file (needs Compose v2.24+).
      - path: ../../apps/api/.env
        required: false
    environment:
      # Inside the compose network the datastores are reachable by service name.
      DATABASE_URL: postgresql://tamam:tamam@db:5432/tamam
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/tamam-public
      S3_ACCESS_KEY: tamam
      S3_SECRET_KEY: tamam-secret
      RUN_MIGRATIONS: 'true'
      # Brings the stack up populated: service types, zones, an admin account.
      # The seed upserts, so restarting does not duplicate anything.
      SEED_ON_START: 'true'
      PORT: '3000'
      NODE_ENV: development
      # ---------------------------------------------------------------
      # LOCAL-ONLY SECRETS.
      #
      # These exist so `docker compose up` works on a fresh clone with no
      # preparation: the API refuses to start without them, and requiring a
      # setup script first meant the documented one-command start was not one
      # command. They are development values and are meant to be visible.
      #
      # Anything reachable from outside your own machine MUST override them —
      # see docs/DEPLOYMENT.md. `apps/api/.env`, loaded above, wins over
      # everything here, so scripts/setup.sh still takes precedence when it
      # has run.
      # ---------------------------------------------------------------
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-access-secret-not-for-real-use}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-development-refresh-secret-not-for-real-use}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-bG9jYWwtZGV2ZWxvcG1lbnQta2V5LTMyLWJ5dGVzLXh4eHg=}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-TamamAdmin#2026}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('node:http').get('http://127.0.0.1:3000/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  admin-web:
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
    container_name: tamam-admin
    restart: unless-stopped
    environment:
      # The browser reaches the API on the published host port; the Next server reaches it by
      # service name inside the compose network. Both must include the /api/v1 prefix — the
      # console appends route paths to this value verbatim.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_WS_BASE_URL: http://localhost:3000
      API_INTERNAL_BASE_URL: http://api:3000/api/v1
      # Encrypts the admin session cookie; the console refuses to start below 32 characters.
      # Override it for anything but a local stack: `SESSION_SECRET=... docker compose up`.
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-change-me-32+}
      SESSION_COOKIE_SECURE: 'false'
      PORT: '3001'
      HOSTNAME: '0.0.0.0'
    ports:
      - '3001:3001'
    depends_on:
      api:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Optional: self-hosted OSRM so routing does not depend on the public
  # demo server. Download a region extract first, then uncomment:
  #
  #   mkdir -p infrastructure/docker/osrm && cd infrastructure/docker/osrm
  #   curl -LO https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf
  #   docker run -t -v "$PWD:/data" osrm/osrm-backend osrm-extract -p /opt/car.lua /data/israel-and-palestine-latest.osm.pbf
  #   docker run -t -v "$PWD:/data" osrm/osrm-backend osrm-partition /data/israel-and-palestine-latest.osrm
  #   docker run -t -v "$PWD:/data" osrm/osrm-backend osrm-customize /data/israel-and-palestine-latest.osrm
  #
  # then set OSRM_BASE_URL=http://osrm:5000 in apps/api/.env
  # ------------------------------------------------------------------
  # osrm:
  #   image: osrm/osrm-backend:v5.27.1
  #   container_name: tamam-osrm
  #   restart: unless-stopped
  #   command: ['osrm-routed', '--algorithm', 'mld', '/data/israel-and-palestine-latest.osrm']
  #   volumes:
  #     - ./osrm:/data
  #   ports:
  #     - '5000:5000'

volumes:
  db-data:
  redis-data:
  minio-data:
